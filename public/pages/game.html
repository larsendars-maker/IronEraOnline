<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Era — Campaign</title><link rel="stylesheet" href="/css/game.css"></head>
<body><header class="gamebar"><a href="/lobby" class="brand">IRON <span>ERA</span></a><div id="roomTitle">CAMPAIGN</div><div id="date">—</div><div class="online">● <span id="online">0</span> ONLINE</div><div id="net">CONNECTING</div></header>
<div class="game-layout"><aside class="left-panel"><div class="country-select"><small>ТВОЯ ДЕРЖАВА</small><select id="countrySelect"></select><button id="chooseCountry">Выбрать страну</button></div><div class="game-tabs"><button class="active" data-tab="overview">Обзор</button><button data-tab="army">Армия</button><button data-tab="economy">Экономика</button><button data-tab="tech">Технологии</button><button data-tab="diplo">Дипломатия</button></div>
<section id="tab-overview" class="tabbody active"><div id="stats" class="statgrid"></div><div class="panel"><h3>Национальные события</h3><div id="events"></div></div></section>
<section id="tab-army" class="tabbody"><div class="panel"><h3>Армия</h3><div id="army"></div></div></section>
<section id="tab-economy" class="tabbody"><div class="actiongrid"><button id="factory">🏭 Построить фабрику</button><button id="division">🪖 Создать пехоту</button></div><div class="panel"><h3>Производство</h3><div id="production"></div></div></section>
<section id="tab-tech" class="tabbody"><div class="panel"><h3>Исследования</h3><div id="tech"></div></div></section>
<section id="tab-diplo" class="tabbody"><div class="actiongrid"><button id="war">⚔ Объявить войну</button><button id="alliance">🛡 Создать альянс</button><button id="relation">🤝 Улучшить отношения</button></div><div class="panel"><h3>Дипломатия</h3><div id="diplo"></div></div></section>
<div class="panel players-panel"><h3>Игроки</h3><div id="players"></div></div><button class="ready" id="ready">ГОТОВ</button><button class="host" id="start">ЗАПУСТИТЬ КАМПАНИЮ</button></aside>
<main class="map-panel"><div class="map-head"><div><small>МИРОВАЯ КАМПАНИЯ</small><h1>Политическая карта</h1></div><div class="map-actions"><button data-mode="political" class="active">Политика</button><button data-mode="industry">Промышленность</button><button data-mode="terrain">Местность</button></div></div><canvas id="map" width="1000" height="720"></canvas><div class="help">ЛКМ — провинция • ПКМ — атака выбранной дивизией</div></main>
<aside class="right-panel"><div class="panel"><h3>МИРОВОЙ ЧАТ</h3><div id="chat"></div><div class="chatrow"><input id="chatInput" placeholder="Сообщение..."><button id="send">➤</button></div></div><div class="panel"><h3>ХРОНИКА</h3><div id="log"></div></div><div class="panel"><h3>ВОЙНЫ</h3><div id="wars"></div></div></aside></div>
<div id="countryModal" class="modal hidden"><div class="modal-card"><h2>Выбери свободную страну</h2><select id="countryModalSelect"></select><button class="btn gold" id="confirmCountry">Подтвердить</button></div></div>
<script src="/js/game.js"></script></body></html>
